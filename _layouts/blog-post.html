---
layout: blog
---

<h4><div class="links"><a href="{{ '/' | relative_url }}">{{ site.title }}</a>/<a href="{{ '/blog/' | relative_url }}">blog</a></h4>

<article class="post">
  <h1>
    {{ page.title }}
    {% if page.subtitle %}<small>{{ page.subtitle }}</small>{% endif %}
  </h1>

  <div class="byline">
    By {{ page.author }}, {{ page.date | date: "%B %e, %Y" }}
  </div>

  <div class="entry">
    {{ content }}
  </div>

</article>

<hr>

<div class="links"><a href="{{ '/blog/' | relative_url }}">&larr; All Posts</a> </div>
