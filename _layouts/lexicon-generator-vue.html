<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/css/lexicon.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <div class="container markdown-body">
      {{ content }}
    </div>

    {% include ga.html %}

    {% if jekyll.environment == "production" %}
      <script src="https://unpkg.com/vue@3.5.22/dist/vue.global.prod.js"></script>
    {% else %}
      <script src="https://unpkg.com/vue@3.5.22/dist/vue.global.js"></script>
    {% endif %}

    <script src="{{ '/assets/js/tango-lexicon-generator.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
