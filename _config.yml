title: "Operating Manual for Tango"
description: "An open source approach to teaching tango."

# Served from the custom domain manual.awakentango.com (CNAME to
# pdamoc.github.io, custom domain set in the repo's Pages settings). Every
# internal link goes through the `relative_url` filter, so moving the site is
# just a matter of changing `url`/`baseurl` here.
url: "https://manual.awakentango.com"
baseurl: ""

theme: jekyll-theme-primer

# Used for the "submit an issue" links.
repository: pdamoc/tangomanual

permalink: "/blog/:year/:month/:day/:title/"

# Post permalinks contain the date, so without this the generated URL depends on
# the timezone of whichever machine runs the build. UTC matches what GitHub
# Pages used, so existing post URLs stay put.
timezone: UTC

sass:
  # jekyll-theme-primer 0.6.0 still uses `/` for division, which Dart Sass
  # deprecated. Silence warnings coming from dependencies, not from our own
  # stylesheets.
  quiet_deps: true

# Renamed from `gems:` in Jekyll 3.5; `gems:` is an error in Jekyll 4.
plugins:
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jemoji

# Language handling: the Romanian translation mirrors the English tree under
# /ro/. Pages there automatically get `lang: ro`, which the layouts and
# includes use to pick the right language for chrome text (headers, footers,
# ring titles from _data/tm_v1_ro.yml) and the language switcher.
defaults:
  - scope:
      path: ""
    values:
      lang: "en"
  - scope:
      path: "ro"
    values:
      lang: "ro"

# Set this to a GA4 measurement ID (e.g. "G-XXXXXXXXXX") to enable analytics.
# Left blank, no analytics script is emitted at all.
google_analytics: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
