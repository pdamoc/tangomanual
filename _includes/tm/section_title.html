{% if page.lang == "ro" %}
  {% assign tm_sections = site.data.tm_v1_ro["section"] %}
{% else %}
  {% assign tm_sections = site.data.tm_v1["section"] %}
{% endif %}
<h{{include.size}} class="section-title {{ tm_sections[include.section].color }}">
  {% if include.number==true %}
  {{ include.section }}&nbsp;
  {% endif %}
  {{ tm_sections[include.section].title }}
</h{{include.size}}>
